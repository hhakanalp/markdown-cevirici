name: Uygulamayi derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install "markitdown[all]" pyinstaller

      - name: Uygulamayi paketle
        run: >
          python -m PyInstaller --noconfirm --windowed --name "Markdown Cevirici"
          --collect-all markitdown --collect-all magika md_cevirici.py

      - name: Paketlenmis uygulamayi test et
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Markdown Cevirici\Markdown Cevirici.exe" -ArgumentList "--selftest","$PWD\rapor.txt" -Wait -PassThru
          Get-Content rapor.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Kurulum dosyasini olustur
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=1.0.${{ github.run_number }}" kurulum.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Output/Markdown-Cevirici-Kurulum.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install "markitdown[all]" pyinstaller

      - name: Uygulamayi paketle
        run: >
          python -m PyInstaller --noconfirm --windowed --name "Markdown Cevirici"
          --collect-all markitdown --collect-all magika md_cevirici.py

      - name: Paketlenmis uygulamayi test et
        run: |
          "dist/Markdown Cevirici.app/Contents/MacOS/Markdown Cevirici" --selftest "$PWD/rapor.txt"; kod=$?
          cat rapor.txt
          exit $kod

      - name: DMG olustur
        run: |
          mkdir dmg
          cp -R "dist/Markdown Cevirici.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Markdown Cevirici" -srcfolder dmg -ov -format UDZO Markdown-Cevirici-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Markdown-Cevirici-macOS.dmg

  yayinla:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Markdown Çevirici 1.0.${{ github.run_number }}
          body: |
            **Windows:** Markdown-Cevirici-Kurulum.exe dosyasını indirip çalıştırın.
            **macOS:** Markdown-Cevirici-macOS.dmg dosyasını açıp uygulamayı Applications klasörüne sürükleyin.
          files: |
            Markdown-Cevirici-Kurulum.exe
            Markdown-Cevirici-macOS.dmg
